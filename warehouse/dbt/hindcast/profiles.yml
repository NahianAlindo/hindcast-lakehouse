# Committed (not in ~/.dbt/) so `dbt build --target duckdb` reproduces
# identically for anyone who clones the repo (docs/PLAN.md §10's zero-cost
# fallback: "the full star schema remains reproducible by anyone who clones
# the repo"). No secrets live here -- the ADLS connection string is read
# from AZURE_STORAGE_CONNECTION_STRING at run time (same env var the
# extractor and WSL2 Spark dev flow already use), never hardcoded.
hindcast:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'hindcast.duckdb') }}"
      extensions:
        - delta
        - azure
      settings:
        # DuckDB's Azure C++ SDK transport defaults to an adapter that
        # doesn't resolve Linux's system CA bundle (hit this live in WSL2:
        # "Problem with the SSL CA cert" against a real ADLS read that
        # worked fine over plain HTTPS from every other tool in this repo).
        # curl transport doesn't have that bug.
        azure_transport_option_type: "curl"
      secrets:
        # delta_scan() (delta-rs/object_store under the hood) resolves
        # credentials via DuckDB's CREATE SECRET, not the legacy
        # azure_storage_connection_string SETTING -- hit this live as
        # "Account must be specified" even with that setting correctly set,
        # since it's a different credential-resolution path from the native
        # azure filesystem reader.
        - type: azure
          connection_string: "{{ env_var('AZURE_STORAGE_CONNECTION_STRING') }}"

    # Not used until Phase 6 (docs/PLAN.md: Snowflake trial doesn't start
    # until Week 6, deliberately, to not burn trial days early). Defining
    # the target now is what "dual target from day one" (CLAUDE.md) means --
    # the account/warehouse/etc. below don't exist yet and won't be created
    # before then.
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORMER') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'HINDCAST') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'HINDCAST_XS') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'MARTS') }}"
      threads: 4

    # Databricks Free Edition (side-track demo environment, not on the
    # critical path -- docs/PLAN.md's phases are unaffected). Only
    # serverless SQL warehouses are available on this tier, so there's no
    # abfs/hadoop-azure connector for reading ADLS in place the way
    # duckdb's delta_scan does; sources instead read from
    # workspace.hindcast_silver, loaded by warehouse/databricks/
    # export_silver_snapshot.py + load_into_databricks.py's COPY INTO
    # (mirrors the same three silver tables Phase 6's Snowflake COPY INTO
    # reads).
    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '/sql/1.0/warehouses/3e7e1236bdf67349') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'workspace') }}"
      schema: "{{ env_var('DATABRICKS_SCHEMA', 'hindcast') }}"
      threads: 4

# elementary-data's `edr report`/`edr monitor` CLI runs its own internal dbt
# project (bundled inside the package), whose dbt_project.yml hard-codes
# `profile: elementary` -- a real, documented Elementary requirement, not
# something configurable away (hit this live: "Could not find profile named
# 'elementary'" against just the `hindcast` profile above). Same Snowflake
# connection as the `hindcast` profile's snowflake output, schema matching
# dbt_project.yml's `models: elementary: +schema: elementary` so both
# elementary's own writes and this project's reads land in the same place.
elementary:
  target: snowflake
  outputs:
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORMER') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'HINDCAST') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'HINDCAST_XS') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'MARTS') }}_elementary"
      threads: 4
