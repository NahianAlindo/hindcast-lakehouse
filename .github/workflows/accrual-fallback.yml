name: accrual-fallback

# Phase 3: Airflow (owm_current_ingest, owm_forecast_ingest,
# owm_air_quality_ingest, on the VM) is now the primary scheduler. This
# workflow was the interim scheduler before that existed, and now reverts to
# what docs/PLAN.md's Phase 8 always intended it to be -- the $0 continuity
# path, run on demand if the VM/Airflow is ever down, not a permanent
# parallel scheduler. The schedule: triggers are deliberately removed: with
# both this and Airflow running the same cadences, two independent writers
# would race the forecast dedup-state blob in ADLS (see
# run_forecast.fetch_and_land's docstring) with no coordination between
# them. Trigger manually via workflow_dispatch (endpoint=all by default) if
# the VM is down for an extended stretch.
#
# Writes straight to Azure ADLS Gen2 (bronze container) via a storage
# account connection string -- not a Managed Identity, since this runner
# isn't an Azure resource and this tenant blocks Service Principal/OIDC
# federation for students (see CLAUDE.md). A connection string is the
# pragmatic, fully-working alternative for storage specifically.

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: "Which extractor to run (current, forecast, air_quality, all)"
        required: false
        default: "all"

concurrency:
  group: accrual-fallback
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - run: uv sync --frozen --no-build

      - name: Write .env from secrets
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          OWM_BASE_URL: ${{ secrets.OWM_BASE_URL }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          echo "OWM_API_KEY=$OWM_API_KEY" >> .env
          echo "OWM_BASE_URL=$OWM_BASE_URL" >> .env
          echo "AZURE_STORAGE_CONNECTION_STRING=$AZURE_STORAGE_CONNECTION_STRING" >> .env

      - name: Run current-weather extractor
        if: github.event.inputs.endpoint == 'current' || github.event.inputs.endpoint == 'all'
        run: uv run --frozen --no-build python ingestion/hindcast_extract/run_current.py

      - name: Run forecast extractor
        if: github.event.inputs.endpoint == 'forecast' || github.event.inputs.endpoint == 'all'
        run: uv run --frozen --no-build python ingestion/hindcast_extract/run_forecast.py

      - name: Run air-quality extractor
        if: github.event.inputs.endpoint == 'air_quality' || github.event.inputs.endpoint == 'all'
        run: uv run --frozen --no-build python ingestion/hindcast_extract/run_air_quality.py
