name: accrual-fallback

# Interim scheduler for the three OpenWeatherMap extractors, standing in for
# Airflow until Phase 3 stands it up. Also doubles as the plan's own
# Phase-8 "$0 continuity path" (docs/PLAN.md), just promoted earlier: it
# keeps ingestion alive from GitHub's free runners if the Azure VM is ever
# down. Free-tier cron is delayed/skipped under load -- tolerated by
# design, since `issued_at` is minted from the actual request time inside
# the extractor, never inferred from this schedule.
#
# Writes straight to Azure ADLS Gen2 (bronze container) via a storage
# account connection string -- not a Managed Identity, since this runner
# isn't an Azure resource and this tenant blocks Service Principal/OIDC
# federation for students (see CLAUDE.md). A connection string is the
# pragmatic, fully-working alternative for storage specifically.
# GitHub Actions runners are otherwise ephemeral and used to require
# committing bronze back to the repo as an interim durable store before
# ADLS existed -- that stopgap is retired now that it does.

on:
  schedule:
    - cron: "*/30 * * * *"  # current weather
    - cron: "0 */3 * * *"   # forecast
    - cron: "0 * * * *"     # air quality
  workflow_dispatch:
    inputs:
      endpoint:
        description: "Which extractor to run (current, forecast, air_quality, all)"
        required: false
        default: "all"

concurrency:
  group: accrual-fallback
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - run: uv sync --frozen --no-build

      - name: Write .env from secrets
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          OWM_BASE_URL: ${{ secrets.OWM_BASE_URL }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          echo "OWM_API_KEY=$OWM_API_KEY" >> .env
          echo "OWM_BASE_URL=$OWM_BASE_URL" >> .env
          echo "AZURE_STORAGE_CONNECTION_STRING=$AZURE_STORAGE_CONNECTION_STRING" >> .env

      - name: Run current-weather extractor
        if: github.event.schedule == '*/30 * * * *' || github.event.inputs.endpoint == 'current' || github.event.inputs.endpoint == 'all'
        run: uv run --frozen --no-build python ingestion/hindcast_extract/run_current.py

      - name: Run forecast extractor
        if: github.event.schedule == '0 */3 * * *' || github.event.inputs.endpoint == 'forecast' || github.event.inputs.endpoint == 'all'
        run: uv run --frozen --no-build python ingestion/hindcast_extract/run_forecast.py

      - name: Run air-quality extractor
        if: github.event.schedule == '0 * * * *' || github.event.inputs.endpoint == 'air_quality' || github.event.inputs.endpoint == 'all'
        run: uv run --frozen --no-build python ingestion/hindcast_extract/run_air_quality.py
